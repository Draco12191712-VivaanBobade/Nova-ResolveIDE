name: Nightly Changelog Update

on:
  schedule:
    # This runs every single night at 9:00 PM UTC.
    # Note: If you want 9:00 PM in YOUR local timezone, you must adjust the "21" to match UTC!
    - cron: '0 21 * * *' 

jobs:
  generate-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essential: tells Git to fetch all history so git-cliff can read commits

      - name: Run git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased -o CHANGELOG.md

      - name: Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Keeps it clean: only commits if your code actually changed today
          git diff-index --quiet HEAD || git commit -m "docs: update nightly changelog [skip ci]"
          git push
